name: C Code Formatting Check

on:
  push:

jobs:
  format-check:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run clang-format Check
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: '16'
          check-path: '.'
          fallback-style: 'file'
